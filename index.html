<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f3f3f3;
    padding:20px;
}

.container{
    width:80%;
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#1565c0;
    font-size:32px;
}

.bank-section{
    margin-bottom:30px;
}

.bank-grid{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:15px;
    max-width:900px;
    margin:auto;
}
.bank-card{
    width:100%;
    aspect-ratio:1.4/1;
    height:auto;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
}

.bank-card img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:10px;
}

@media(max-width:768px){

    .bank-grid{
        grid-template-columns:repeat(6,1fr);
        gap:6px;
    }

    .bank-card{
        border-radius:8px;
    }

    .bank-card img{
        width:100%;
        height:100%;
        object-fit:contain;
        padding:4px;
    }
	
	
#historyBtn{
    margin-right:10px;
}
}

.upload-box{
    border:2px dashed #1565c0;
    padding:25px;
    border-radius:10px;
    text-align:center;
    margin-bottom:25px;
}

.loading{
    text-align:center;
    color:green;
    margin-bottom:20px;
    font-size:18px;
    font-weight:bold;
}

.search-box{
    position:relative;
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:2px solid #000000;
    border-radius:10px;
    font-size:18px;
    background:#fff3e0;
    color:#000;
}

#downloadBtn{
    display:none;
    margin:10px 0;
    padding:10px 14px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#downloadBtn:hover{
    background:#0d47a1;
}

#suggestions{
    position:absolute;
    width:100%;
    background:white;
    border:1px solid #ddd;
    border-top:none;
    max-height:300px;
    overflow-y:auto;
    z-index:1000;
    left:0;
}

.suggestion-item{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #eee;
    text-align:left;
}

.suggestion-item:hover{
    background:#f3f3f3;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:600px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:left;
    word-break:break-word;
}

th{
    background:#1565c0;
    color:white;
}

.not-listed{
    color:red;
    font-weight:bold;
}

#resultCount{
    margin-bottom:15px;
    color:#1565c0;
    font-weight:bold;
    text-align:left;
}

#excelFile{
    display:none;
}
.file-btn {
    display:inline-block;
    padding:10px 16px;
    background:red;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.file-btn.uploading {
    background:#1565c0 !important;
}

.file-btn.success {
    background:green !important;
}

.file-btn.error {
    background:#d32f2f !important;
}

.file-btn:hover{
    background:darkred;
}

.file-btn.success{
    background:green !important;
}

.file-btn.error{
    background:#d32f2f !important;
}

#fileMsg{
    margin-top:10px;
    font-weight:bold;
    color:red;
    text-align:center;
}

/* MOBILE FIX */
@media(max-width:768px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    h1{
        font-size:24px;
    }

    .bank-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .bank-card img{
        height:60px;
    }

    .search-box input{
        font-size:16px;
        padding:12px;
    }

    th,td{
        padding:10px;
        font-size:14px;
    }

    #downloadBtn{
        width:auto;
        font-size:14px;
    }
}
table{
    background:white;
}

/* =========================
   NORMALIZE FUNCTION
========================= */
function normalizeCompanyName(name){

    return name.toString()
    .replace(/[^a-zA-Z0-9 ]/g,' ')
    .replace(/\bPRIVATE\b/gi,'PVT')
    .replace(/\bLIMITED\b/gi,'LTD')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

/* =========================
   INDEXEDDB SETUP
========================= */

let db;

const DB_NAME = "ExcelDB";
const STORE_NAME = "files";

function openDB(){

    return new Promise((resolve, reject) => {

        let request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function(e){

            db = e.target.result;

            if(!db.objectStoreNames.contains(STORE_NAME)){

                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function(e){

            db = e.target.result;
            resolve(db);
        };

        request.onerror = function(err){

            reject(err);
        };
    });
}

/* =========================
   SAVE FILE TO DB
========================= */

function saveExcelToDB(file){

    return new Promise((resolve, reject) => {

        let tx = db.transaction(STORE_NAME, "readwrite");

        let store = tx.objectStore(STORE_NAME);

        store.put(file, "excelFile");

        tx.oncomplete = () => resolve();

        tx.onerror = err => reject(err);
    });
}

/* =========================
   GET FILE FROM DB
========================= */

function getExcelFromDB(){

    return new Promise((resolve, reject) => {

        let tx = db.transaction(STORE_NAME, "readonly");

        let store = tx.objectStore(STORE_NAME);

        let req = store.get("excelFile");

        req.onsuccess = () => resolve(req.result);

        req.onerror = err => reject(err);
    });
}

    const canvas = await html2canvas(area, {

        scale: 4,
        useCORS: true,
        backgroundColor: "#ffffff",
        scrollX: 0,
        scrollY: -window.scrollY,
        windowWidth: document.documentElement.scrollWidth,
        windowHeight: document.documentElement.scrollHeight
    });

    area.style.overflow = oldOverflow;
    area.style.width = oldWidth;

    canvas.toBlob(function(blob){

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        a.download = "company-result.jpg";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    }, "image/jpeg", 1.0);
});

function calculateEMI(){

let P = parseFloat(
document.getElementById("emiAmount").value
);

let annualRate = parseFloat(
document.getElementById("emiRate").value
);

let N = parseInt(
document.getElementById("emiTenure").value
);

if(!P || !annualRate || !N){

document.getElementById("emiResult").innerHTML =
"⚠ Please fill all fields";

return;
}

let R = annualRate / 12 / 100;

let EMI =
(P * R * Math.pow(1+R,N))
/
(Math.pow(1+R,N)-1);

EMI = EMI.toFixed(0);

document.getElementById("emiResult").innerHTML =
"✅ EMI: ₹" +
Number(EMI).toLocaleString("en-IN");
}
