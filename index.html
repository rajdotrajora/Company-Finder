/* =========================
   NORMALIZE FUNCTION
========================= */
function normalizeCompanyName(name){

    return name.toString()
    .replace(/[^a-zA-Z0-9 ]/g,' ')
    .replace(/\bPRIVATE\b/gi,'PVT')
    .replace(/\bLIMITED\b/gi,'LTD')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

/* =========================
   INDEXEDDB SETUP
========================= */

let db;

const DB_NAME = "ExcelDB";
const STORE_NAME = "files";

function openDB(){

    return new Promise((resolve, reject) => {

        let request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = function(e){

            db = e.target.result;

            if(!db.objectStoreNames.contains(STORE_NAME)){

                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function(e){

            db = e.target.result;
            resolve(db);
        };

        request.onerror = function(err){

            reject(err);
        };
    });
}

/* =========================
   OPEN DB ON PAGE LOAD
========================= */

window.addEventListener("load", async function(){

    let btn = document.getElementById("fileBtn");

    await openDB();

    let file = await getExcelFromDB();

    /* ✅ IF EXCEL EXISTS */
   if(file){

    btn.innerText = "Loading Excel...";

    btn.classList.remove("success");

    document.getElementById("loading").innerText =
    "Please wait...";

    document.getElementById("searchInput").disabled = true;

    setTimeout(async () => {

        await loadExcelData(file);

        excelLoaded = true;

        btn.innerText = "Excel Uploaded ✔";

        btn.classList.add("success");

        document.getElementById("loading").innerText = "";

        document.getElementById("searchInput").disabled = false;

    }, 30000)
}
    /* ✅ IF NO EXCEL */
    else{

        btn.innerText = "Upload Excel";

        btn.classList.remove("success");
    }
});

/* =========================
   SAVE FILE TO DB
========================= */

function saveExcelToDB(file){

    return new Promise((resolve, reject) => {

        let tx = db.transaction(STORE_NAME, "readwrite");

        let store = tx.objectStore(STORE_NAME);

        store.put(file, "excelFile");

        tx.oncomplete = () => resolve();

        tx.onerror = err => reject(err);
    });
}

/* =========================
   GET FILE FROM DB
========================= */

function getExcelFromDB(){

    return new Promise((resolve, reject) => {

        let tx = db.transaction(STORE_NAME, "readonly");

        let store = tx.objectStore(STORE_NAME);

        let req = store.get("excelFile");

        req.onsuccess = () => resolve(req.result);

        req.onerror = err => reject(err);
    });
}

/* =========================

========================= */

/* =========================
   LOAD EXCEL DATA FUNCTION
========================= */

     async function loadExcelData(file){

    let reader = new FileReader();

    reader.onload = function(event){

        try{

            let data = new Uint8Array(event.target.result);

            let workbook = XLSX.read(data,{type:'array'});

            allData = [];
            companyMap.clear();

            workbook.SheetNames.forEach(sheetName => {

                let sheet = workbook.Sheets[sheetName];

                let json = XLSX.utils.sheet_to_json(sheet);

                json.forEach(row => {

                    let company = row["COMPANY NAME"];
                    let category = row["Category"];

                    if(company && category){

                        let item = {

                            bank: sheetName,
                            company: company.toString().trim(),
                            category: category.toString().trim()
                        };

                        allData.push(item);

                        let key = normalizeCompanyName(item.company);

                        if(!companyMap.has(key)){

                            companyMap.set(key, []);
                        }

                        companyMap.get(key).push(item);
                    }
                });
            });

            excelLoaded = true;

            document.getElementById("loading").innerText =
            "Excel Loaded Successfully ✔";

            document.getElementById("searchInput").disabled = false;

            setTimeout(()=>{

                document.getElementById("loading").innerText = "";

            },2000);

        }catch(err){

            console.error(err);

            document.getElementById("loading").innerText =
            "Excel Load Failed ❌";
        }
    };

    reader.readAsArrayBuffer(file);
}

/* =========================
   FILE UPLOAD EVENT
========================= */

document.getElementById("excelFile")
.addEventListener("change", async function(e){

    let file = e.target.files[0];

    if(!file) return;

    let btn = document.getElementById("fileBtn");

    document.getElementById("loading").innerText =
    "Loading Excel File...";

    btn.innerText = "Uploading...";

    btn.classList.remove("success","error");

    try{

        if(!db){

            await openDB();
        }

        loadExcelData(file);

        await saveExcelToDB(file);

        btn.classList.add("success");

        btn.innerText = "Excel Uploaded ✔";

    }catch(err){

        console.error(err);

        btn.classList.add("error");

        btn.innerText = "Upload Failed";

        document.getElementById("loading").innerText =
        "Excel Load Failed ❌";
    }
});

/* =========================
   SEARCH SYSTEM
========================= */

let suggestions = document.getElementById("suggestions");

let timeout;
let autoClearTimer;
let countdownInterval;

document.getElementById("searchInput")
.addEventListener("input", function(){

    clearTimeout(timeout);

    timeout = setTimeout(() => {

        let search = normalizeCompanyName(this.value);

        suggestions.innerHTML = "";

        if(search.length < 2){
		clearTimeout(autoClearTimer);
clearInterval(countdownInterval);

document.getElementById("countdownTimer").style.display = "none";
		


            document.getElementById("resultTable")
            .style.display = "none";

            document.getElementById("resultCount")
            .innerText = "";

            document.getElementById("downloadBtn")
            .style.display = "none";

            return;
        }

        let matches = [];

        for(let [key,val] of companyMap){

            if(key.includes(search)){

                matches.push(val[0].company);
            }

            if(matches.length >= 10) break;
        }

        if(matches.length === 0){

            suggestions.innerHTML =
            `<div class="suggestion-item">
            No Record Found
            </div>`;

            return;
        }

        suggestions.innerHTML = matches.map(c =>

        `<div class="suggestion-item">${c}</div>`

        ).join("");

    },100);
});

    suggestions.innerHTML = "";

    let key = normalizeCompanyName(company);

    let data = companyMap.get(key) || [];

    let banks = [...new Set(allData.map(x => x.bank))];

    let html = "";

    let foundBanks = 0;

    lastResult = [];

    banks.forEach(bank => {

        let match = data.find(x => x.bank === bank);

        if(match){

            foundBanks++;

            html += `
            <tr>
                <td>${match.bank}</td>
                <td>${match.company}</td>
                <td>${match.category}</td>
            </tr>`;

            lastResult.push(match);

        }else{

            html += `
            <tr>
                <td>${bank}</td>
                <td>${company}</td>
                <td class="not-listed">NOT LISTED</td>
            </tr>`;
        }
    });

    document.getElementById("resultBody").innerHTML = html;

    document.getElementById("resultCount").innerText =
    `Found in ${foundBanks} Banks`;
	document.getElementById("downloadBtn").style.display =
"inline-block";

    document.getElementById("resultTable").style.display =
    "table";
clearTimeout(autoClearTimer);
clearInterval(countdownInterval);

document.getElementById("countdownTimer").style.display = "block";
document.getElementById("countdownTimer").innerText =
"Result clear in: 120s";

countdownInterval = setInterval(() => {

    seconds--;

    document.getElementById("countdownTimer").innerText =
    "Result clear in: " + seconds + "s";

}, 1000);

}, 120000);

/* =========================
   HISTORY SYSTEM
========================= */

let searchHistory =
JSON.parse(localStorage.getItem("companyHistory")) || [];

function saveToHistory(company){

    company = company.trim();

    // Duplicate remove
    searchHistory = searchHistory.filter(
        item => item.toLowerCase() !== company.toLowerCase()
    );

    // New company top par
    searchHistory.unshift(company);

    // Sirf latest 3
searchHistory = searchHistory.slice(0,10);
    localStorage.setItem(
        "companyHistory",
        JSON.stringify(searchHistory)
    );
}

    box.innerHTML = "";

/* =========================
   JPG DOWNLOAD
========================= */

document.getElementById("downloadBtn")
.addEventListener("click", async function(){

    let area = document.getElementById("tableArea");

    let oldOverflow = area.style.overflow;
    let oldWidth = area.style.width;

    area.style.overflow = "visible";
    area.style.width = "max-content";

    const canvas = await html2canvas(area, {

        scale: 4,
        useCORS: true,
        backgroundColor: "#ffffff",
        scrollX: 0,
        scrollY: -window.scrollY,
        windowWidth: document.documentElement.scrollWidth,
        windowHeight: document.documentElement.scrollHeight
    });

    area.style.overflow = oldOverflow;
    area.style.width = oldWidth;

    canvas.toBlob(function(blob){

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        a.download = "company-result.jpg";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

    }, "image/jpeg", 1.0);
});
</script>
